services:
  - type: web
    name: ej-fa-desktop
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SF_LOGIN_URL
        value: https://login.salesforce.com
      - key: SF_API_VERSION
        value: "62.0"
      - key: SF_USERNAME
        sync: false
      # If Render's outbound IP is not a trusted IP in the org, set
      # SF_PASSWORD = <password><securityToken>. From a trusted IP the
      # plain password is enough.
      - key: SF_PASSWORD
        sync: false
